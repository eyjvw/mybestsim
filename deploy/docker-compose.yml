# Services of ~/infra/docker-compose.yml on the VPS (see docs/DEPLOY.md), kept identical here.
# The outer Caddy proxies mybestsim.sbonneau.xyz to `mybestsim:80` (deploy/Caddyfile).
services:
  mybestsim:
    image: ghcr.io/eyjvw/mybestsim:latest
    container_name: mybestsim
    restart: unless-stopped
    expose: ["80"]
    volumes:
      - mybestsim-data:/live:ro
    depends_on: [mybestsim-ingest]
    environment:
      INGEST_UPSTREAM: mybestsim-ingest:3000
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # A new volume belongs to root and the ingest service runs as `bun`: hand it over once.
  mybestsim-data-init:
    image: ghcr.io/eyjvw/mybestsim-ingest:latest
    container_name: mybestsim-data-init
    user: "0"
    entrypoint: ["chown", "bun:bun", "/data"]
    volumes:
      - mybestsim-data:/data
    restart: "no"

  mybestsim-ingest:
    image: ghcr.io/eyjvw/mybestsim-ingest:latest
    container_name: mybestsim-ingest
    restart: unless-stopped
    depends_on:
      mybestsim-data-init:
        condition: service_completed_successfully
    expose: ["3000"]
    volumes:
      - mybestsim-data:/data
    env_file: .env.mybestsim # INGEST_TOKEN, WEBHOOK_URL (never committed)
    environment:
      TZ: Europe/Paris
      SITE_URL: https://mybestsim.sbonneau.xyz
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  mybestsim-data:
