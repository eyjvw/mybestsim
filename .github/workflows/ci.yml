name: CI

# Every PR: lint, typecheck, data validation, tests, build and a Docker build.
# Every push to main: same checks, then publish the image to GHCR. Watchtower on
# the VPS pulls the new `latest` within a minute; `verify` waits until the live
# site reports this exact commit, so a deploy that never lands turns CI red.
# `verify` runs once the repository variable DEPLOY_ENABLED is set to "true".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://mybestsim.sbonneau.xyz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run check
      - name: Validate supplier CSVs
        run: bun run validate
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase, the repository name may not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: image
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the live site to serve this commit
        run: |
          for i in $(seq 1 42); do
            live=$(curl -fsS "$SITE_URL/version.json" | jq -r .sha || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live on $GITHUB_SHA"; exit 0; fi
            echo "attempt $i: live=${live:-unreachable}, waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "::error::Deploy did not reach $SITE_URL within 7 minutes"
          exit 1
      - name: Smoke test
        run: |
          curl -fsS "$SITE_URL/" | grep -q 'data-kpi="total"'
          curl -fsS "$SITE_URL/stats.json" | jq -e '.total > 0 and (.quality.rejected | length) == 0'
