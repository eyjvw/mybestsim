# Weekly dependency updates, one PR per ecosystem group. Each PR runs the full CI
# (unit, e2e, Docker build), so an upgrade only lands green.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # astro check (@astrojs/check 0.9) refuses TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Must move together with the Playwright image of the e2e job (ci.yml): bumped by hand.
      - dependency-name: "@playwright/test"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
